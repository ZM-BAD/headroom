<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Border Preview</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        background: #f8fafc;
        padding: 24px;
      }
      h2 {
        margin-top: 24px;
      }
      .row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .card {
        text-align: center;
        font-size: 12px;
        color: #64748b;
      }
      .card img {
        width: 128px;
        height: 128px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Logo Border — light bg (#f8fafc)</h1>
    <div class="row">
      <div class="card">
        <img src="border-now.png" /><br />now — stroke:#d4d4d8 2px
      </div>
      <div class="card">
        <img src="border-border-3-gray.png" /><br />stroke:#9ca3af 3px
      </div>
      <div class="card">
        <img src="border-border-4-slate.png" /><br />stroke:#64748b 4px
      </div>
      <div class="card">
        <img src="border-border-3-dark.png" /><br />stroke:#374151 3px
      </div>
    </div>
  </body>
</html>
