name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --depth=1 origin "$GITHUB_BASE_REF"
            npx commitlint --from "origin/$GITHUB_BASE_REF" --to HEAD
          else
            npx commitlint --last
          fi

      - name: Lint
        run: npm run lint

      - name: Check i18n keys (en ↔ zh_CN)
        run: npm run check:i18n

      - name: Check host permissions
        run: npm run check:permissions

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          echo '## 📊 Test Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const r = JSON.parse(readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const t = r.total;
            console.log('Statements : ' + t.statements.pct.toFixed(1) + '% (' + t.statements.covered + '/' + t.statements.total + ')');
            console.log('Branches   : ' + t.branches.pct.toFixed(1) + '% (' + t.branches.covered + '/' + t.branches.total + ')');
            console.log('Functions  : ' + t.functions.pct.toFixed(1) + '% (' + t.functions.covered + '/' + t.functions.total + ')');
            console.log('Lines      : ' + t.lines.pct.toFixed(1) + '% (' + t.lines.covered + '/' + t.lines.total + ')');
          " >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Build (Edge)
        run: npm run build:edge
