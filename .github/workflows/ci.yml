name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --depth=1 origin "$GITHUB_BASE_REF"
            npx commitlint --from "origin/$GITHUB_BASE_REF" --to HEAD
          else
            npx commitlint --last
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox
