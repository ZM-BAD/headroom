name: CI

on:
  # Run on ANY branch push (feature branches need the same gate as main) —
  # the commitlint step falls back to `--last` when not on a PR.
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --depth=1 origin "$GITHUB_BASE_REF"
            npx commitlint --from "origin/$GITHUB_BASE_REF" --to HEAD
          else
            npx commitlint --last
          fi

      # Single source of truth for local + CI gates. `.husky/pre-commit`
      # invokes the exact same `npm run check` command.
      - name: Shared quality gate
        run: npm run check

      - name: Coverage summary
        run: |
          echo '## 📊 Test Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const r = JSON.parse(readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const t = r.total;
            console.log('Statements : ' + t.statements.pct.toFixed(1) + '% (' + t.statements.covered + '/' + t.statements.total + ')');
            console.log('Branches   : ' + t.branches.pct.toFixed(1) + '% (' + t.branches.covered + '/' + t.branches.total + ')');
            console.log('Functions  : ' + t.functions.pct.toFixed(1) + '% (' + t.functions.covered + '/' + t.functions.total + ')');
            console.log('Lines      : ' + t.lines.pct.toFixed(1) + '% (' + t.lines.covered + '/' + t.lines.total + ')');
          " >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
